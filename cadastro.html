<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Blog Geek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">GeekBlog</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li> |
                <li><a href="Personagens.html">Personagens</a></li> |
                <li><a href="hqs.html">Promoções de HQs</a></li> |
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main class="register-container">
        <div class="register-card">
            <div class="title-container">
                <h2>Criar Conta</h2>
                <span style="font-size: 1.5rem;">🚀</span>
            </div>
            <p class="subtitle">Cadastre-se para gerenciar e postar no blog</p>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail ou Usuário</label>
                    <input type="text" id="email" name="email" placeholder="seuemail@geek.com" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-register">Finalizar Cadastro</button>
            </form>

            <p class="register-footer">
                Já possui uma conta? <a href="login.html">Faça login</a>
            </p>
        </div>
    </main>

</body>
</html>
