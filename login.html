<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GeekBlog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">GeekBlog</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li> |
                <li><a href="Personagens.html">Personagens</a></li> |
                <li><a href="hqs.html">Promoções de HQs</a></li> |
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-container">
        <form class="login-card">
            <h2>Área do Admin 🔑</h2>
            <p>Faça login para gerenciar e postar no blog</p>

            <div class="input-group">
                <label for="email">E-mail ou Usuário</label>
                <input type="text" id="email" placeholder="seuemail@geek.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Entrar no Painel</button>

            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>

        </form>
    </main>

</body>
</html>
